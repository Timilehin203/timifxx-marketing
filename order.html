<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="api-base-url"
    content="https://timifxx-marketing-production.up.railway.app"
  >

  <meta
    name="description"
    content="Place your Telegram marketing order with TimiFxx Marketing."
  >

  <title>
    Place Order | TimiFxx Marketing
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <link
    rel="stylesheet"
    href="css/order.css"
  >

</head>


<body>

  <header class="site-header">

    <nav class="nav container">

      <a
        class="brand"
        href="index.html"
      >
        TimiFxx <span>Marketing</span>
      </a>


      <div class="nav-links">

        <a href="index.html#services">
          Services
        </a>

        <a href="order-status.html">
          Track Order
        </a>

        <a
          href="https://t.me/timifxx203"
          target="_blank"
          rel="noopener noreferrer"
        >
          Contact
        </a>

      </div>

    </nav>

  </header>


  <main class="form-page container">

    <div class="section-heading">

      <p class="eyebrow">
        ORDER
      </p>

      <h1>
        Place your order
      </h1>

      <p>
        Select a Telegram marketing service and provide your
        contact information. After submitting your request,
        you will be directed to Telegram to finalize the deal.
      </p>

    </div>


    <form
      id="orderForm"
      class="order-form"
    >

      <label for="serviceId">

        Service

        <select
          id="serviceId"
          required
        >

          <option value="">
            Loading services...
          </option>

        </select>

      </label>


      <label for="name">

        Your name

        <input
          id="name"
          type="text"
          required
          maxlength="100"
          autocomplete="name"
        >

      </label>


      <label for="email">

        Email

        <input
          id="email"
          type="email"
          required
          maxlength="254"
          autocomplete="email"
        >

      </label>


      <label for="telegramUsername">

        Telegram username

        <input
          id="telegramUsername"
          type="text"
          maxlength="64"
          placeholder="@username"
          autocomplete="off"
        >

      </label>


      <label for="whatsapp">

        WhatsApp number

        <input
          id="whatsapp"
          type="tel"
          maxlength="32"
          autocomplete="tel"
        >

      </label>


      <label for="message">

        Order details

        <textarea
          id="message"
          rows="7"
          maxlength="5000"
          placeholder="Tell us what you need..."
        ></textarea>

      </label>


      <button
        class="button primary"
        type="submit"
      >
        Continue to Telegram
      </button>


      <p
        id="formMessage"
        class="form-message"
        aria-live="polite"
      ></p>

    </form>

  </main>


  <footer class="footer">

    <div class="container footer-inner">

      <span>
        © 2026 TimiFxx Marketing
      </span>

      <a
        href="https://t.me/timifxx203"
        target="_blank"
        rel="noopener noreferrer"
      >
        @timifxx203
      </a>

    </div>

  </footer>


  <script src="js/order.js"></script>

</body>

</html>
