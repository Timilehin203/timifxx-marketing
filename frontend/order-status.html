<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Track Order | TimiFxx Marketing
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <link
    rel="stylesheet"
    href="css/order.css"
  >

</head>


<body>

  <header class="site-header">

    <nav class="nav container">

      <a
        class="brand"
        href="index.html"
      >
        TimiFxx <span>Marketing</span>
      </a>


      <div class="nav-links">

        <a href="index.html">
          Home
        </a>

        <a href="order.html">
          Order
        </a>

        <a
          href="https://t.me/timifxx203"
          target="_blank"
          rel="noopener noreferrer"
        >
          Contact
        </a>

      </div>

    </nav>

  </header>


  <main class="form-page container">

    <div class="section-heading">

      <p class="eyebrow">
        ORDER TRACKING
      </p>

      <h1>
        Track Your Order
      </h1>

      <p>
        Enter the unique order number you received after
        placing your order.
      </p>

    </div>


    <form
      id="trackingForm"
      class="tracking-form"
    >

      <label for="orderNumber">

        Order number

        <input
          id="orderNumber"
          type="text"
          required
          maxlength="40"
          placeholder="TMF-2026-123456"
          autocomplete="off"
        >

      </label>


      <button
        class="button primary"
        type="submit"
      >
        Check Status
      </button>

    </form>


    <div
      id="statusResult"
      class="status-result"
      hidden
      aria-live="polite"
    ></div>

  </main>


  <script src="js/order-status.js"></script>

</body>

</html>
