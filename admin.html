<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="api-base-url"
    content="https://timifxx-marketing-production.up.railway.app"
  >

  <title>
    Admin Dashboard | TimiFxx Marketing
  </title>


  <link
    rel="stylesheet"
    href="css/style.css"
  >


  <link
    rel="stylesheet"
    href="css/admin.css"
  >

</head>


<body>


  <!-- LOGIN SCREEN -->

  <main
    id="loginScreen"
    class="admin-login"
  >

    <section
      class="admin-login-card"
    >

      <p class="eyebrow">
        PRIVATE AREA
      </p>


      <h1>
        Admin Dashboard
      </h1>


      <p>
        Enter your administrator access key to manage orders and services.
      </p>


      <form
        id="loginForm"
        class="admin-login-form"
      >

        <label
          for="adminKey"
        >

          Admin access key


          <input
            id="adminKey"
            type="password"
            required
            autocomplete="current-password"
            placeholder="Enter admin access key"
          >

        </label>


        <button
          class="button primary"
          type="submit"
        >
          Login
        </button>


        <p
          id="loginMessage"
          class="admin-message"
          aria-live="polite"
        ></p>

      </form>

    </section>

  </main>


  <!-- ADMIN DASHBOARD -->

  <main
    id="dashboard"
    class="admin-dashboard"
    hidden
  >


    <!-- HEADER -->

    <header
      class="admin-header"
    >

      <div
        class="admin-header-inner"
      >

        <div>

          <p class="eyebrow">
            TIMIFXX MARKETING
          </p>


          <h1>
            Admin Dashboard
          </h1>

        </div>


        <div
          class="admin-header-actions"
        >

          <a
            class="button ghost"
            href="index.html"
          >
            View Website
          </a>


          <button
            id="refreshButton"
            class="button secondary"
            type="button"
          >
            Refresh Orders
          </button>


          <button
            id="logoutButton"
            class="button ghost"
            type="button"
          >
            Logout
          </button>

        </div>

      </div>

    </header>


    <!-- MAIN -->

    <section
      class="admin-main"
    >


      <!-- SUMMARY -->

      <div
        class="admin-summary"
      >

        <article>

          <span>
            Total Orders
          </span>


          <strong
            id="totalOrders"
          >
            0
          </strong>

        </article>


        <article>

          <span>
            Pending
          </span>


          <strong
            id="pendingOrders"
          >
            0
          </strong>

        </article>


        <article>

          <span>
            In Progress
          </span>


          <strong
            id="progressOrders"
          >
            0
          </strong>

        </article>


        <article>

          <span>
            Completed
          </span>


          <strong
            id="completedOrders"
          >
            0
          </strong>

        </article>

      </div>


      <!-- ORDERS -->

      <div
        class="admin-toolbar"
      >

        <div>

          <h2>
            Incoming Orders
          </h2>


          <p
            id="ordersMessage"
            class="admin-message"
          ></p>

        </div>


        <select
          id="statusFilter"
        >

          <option value="">
            All statuses
          </option>


          <option value="pending">
            Pending
          </option>


          <option value="paid">
            Paid
          </option>


          <option value="in_progress">
            In Progress
          </option>


          <option value="waiting_customer">
            Waiting for Customer
          </option>


          <option value="completed">
            Completed
          </option>


          <option value="cancelled">
            Cancelled
          </option>


          <option value="declined">
            Declined
          </option>

        </select>

      </div>


      <div
        id="ordersContainer"
        class="orders-container"
      >

        <div
          class="orders-loading"
        >
          Loading orders...
        </div>

      </div>


      <!-- SERVICES SECTION -->

      <section
        class="admin-services-section"
      >


        <div
          class="admin-toolbar"
        >

          <div>

            <h2>
              Manage Services
            </h2>


            <p
              id="serviceMessage"
              class="admin-message"
            ></p>

          </div>


          <button
            id="refreshServicesButton"
            class="button secondary"
            type="button"
          >
            Refresh Services
          </button>

        </div>


        <!-- CREATE SERVICE -->

        <article
          class="admin-create-service"
        >

          <h3>
            Create New Service
          </h3>


          <form
            id="createServiceForm"
            class="service-form"
          >


            <div
              class="service-form-grid"
            >

              <label>

                Service Name


                <input
                  id="serviceName"
                  type="text"
                  maxlength="150"
                  required
                  placeholder="Enter service name"
                >

              </label>


              <label>

                Price


                <input
                  id="servicePrice"
                  type="number"
                  min="0"
                  step="0.01"
                  placeholder="0.00"
                >

              </label>


              <label>

                Price Type


                <select
                  id="servicePriceType"
                >

                  <option value="fixed">
                    Fixed Price
                  </option>


                  <option value="starting_from">
                    Starting From
                  </option>


                  <option value="contact">
                    Contact Us
                  </option>

                </select>

              </label>


              <label>

                Turnaround Time


                <input
                  id="serviceTurnaround"
                  type="text"
                  maxlength="150"
                  placeholder="Example: 3-5 days"
                >

              </label>

            </div>


            <label>

              Service Description


              <textarea
                id="serviceDescription"
                rows="5"
                maxlength="3000"
                placeholder="Describe this service..."
              ></textarea>

            </label>


            <label
              class="service-active-label"
            >

              <input
                id="serviceActive"
                type="checkbox"
                checked
              >


              <span>
                This service is active and visible to customers
              </span>

            </label>


            <button
              id="createServiceButton"
              class="button primary"
              type="submit"
            >
              Create Service
            </button>

          </form>

        </article>


        <!-- EXISTING SERVICES -->

        <div
          id="servicesAdminContainer"
          class="admin-services-container"
        >

          <div
            class="orders-loading"
          >
            Loading services...
          </div>

        </div>

      </section>

    </section>

  </main>


  <script
    src="js/admin.js"
  ></script>

</body>

</html>
